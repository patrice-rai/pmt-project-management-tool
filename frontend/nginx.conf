server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Routage Angular : toute adresse inconnue du disque est rendue par index.html.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # L'API est servie par le conteneur du back, nommé « backend » dans Docker Compose.
    # Le nom est résolu à chaque requête, pour que nginx démarre même si le back n'est pas encore prêt.
    location /api/ {
        resolver 127.0.0.11 valid=10s;
        set $backend http://backend:8080;
        proxy_pass $backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
}
