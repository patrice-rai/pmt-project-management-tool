spring.application.name=pmt-backend
server.port=8080

# --- Base de données PostgreSQL -------------------------------------------
# Les valeurs par défaut conviennent au lancement local ; Docker Compose les
# remplace par des variables d'environnement.
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/pmt}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:pmt}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:pmt}

# La structure est créée par database/init.sql : Hibernate se contente de vérifier
# que les entités lui correspondent.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# --- Messagerie (notifications d'assignation) -----------------------------
# En local et dans Docker Compose : Mailpit, un faux serveur SMTP.
spring.mail.host=${MAIL_HOST:localhost}
spring.mail.port=${MAIL_PORT:1025}
pmt.mail.from=${MAIL_FROM:no-reply@pmt.local}

# --- Documentation de l'API -----------------------------------------------
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs
