# Tests d'intégration : base H2 en mémoire en mode PostgreSQL, créée et remplie
# par le vrai script database/init.sql. Hibernate vérifie ensuite que les
# entités correspondent à ce script (ddl-auto=validate).
spring.datasource.url=jdbc:h2:mem:pmt;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=validate
spring.sql.init.mode=always
spring.sql.init.schema-locations=file:../database/init.sql
spring.sql.init.encoding=UTF-8
